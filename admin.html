<!DOCTYPE html>
<html>
<head>
    <title>Sree Cosmetics - Admin Orders</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div id="login-box">
    <h1>🔐 Sree Cosmetics</h1>
    <h2>Admin Login</h2>

    <input type="email" id="admin-email" placeholder="Admin Email">

    <div class="password-box">
    <input type="password" id="admin-password" placeholder="Password">
    <button type="button" onclick="togglePassword()">👁️</button>
</div>

    <button onclick="adminLogin()">Login</button>

    <p id="login-error"></p>
</div>

<div id="admin-panel" style="display:none;">
    <h1>Admin - Orders</h1>

    <div id="order-stats">
    <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="total-orders">0</p>
    </div>

    <div class="stat-card">
        <h3>New Orders</h3>
        <p id="new-orders">0</p>
    </div>

    <div class="stat-card">
        <h3>Shipped</h3>
        <p id="shipped-orders">0</p>
    </div>

    <div class="stat-card">
        <h3>Delivered</h3>
        <p id="delivered-orders">0</p>
    </div>
</div>

    <button onclick="logoutAdmin()">Logout</button>

    <div id="order-search">
    <input
        type="text"
        id="search-orders"
        placeholder="🔎 Search Order ID, name or phone..."
        oninput="searchOrders()"
    >
</div>

<select id="status-filter" onchange="filterByStatus()">
    <option value="All">All Orders</option>
    <option value="New Order">New Orders</option>
    <option value="Confirmed">Confirmed</option>
    <option value="Packed">Packed</option>
    <option value="Shipped">Shipped</option>
    <option value="Delivered">Delivered</option>
</select>

<div id="orders-list"></div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

let orders = [];

const SUPABASE_URL = "https://mdptetvirfxfhfpjylkk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BvNM859TFgKaPOKV99ds9A_Qigy8-Jp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function adminLogin() {
    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;
    const errorBox = document.getElementById("login-error");

    errorBox.innerText = "";

    if (!email || !password) {
        errorBox.innerText = "Please enter email and password.";
        return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        errorBox.innerText = "Login failed: " + error.message;
        return;
    }

    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";

    loadOrders();
}


async function loadOrders() {
    const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Error loading orders:", error);
        ordersList.innerHTML = "<h3>Could not load orders.</h3>";
        return;
    }

    orders = data || [];
    displayOrders();
}

let ordersList = document.getElementById("orders-list");

async function updateStatus(index, status) {

    const order = orders[index];

    const { error } = await supabaseClient
        .from("orders")
        .update({ status: status })
        .eq("order_id", order.order_id);

    if (error) {
        console.error("Status update error:", error);
        alert("Could not update order status.");
        return;
    }

    orders[index].status = status;
    displayOrders();
}

function displayOrders(filteredOrders = orders) {

    document.getElementById("total-orders").innerText = orders.length;

    document.getElementById("new-orders").innerText =
        orders.filter(order => order.status === "New Order").length;

    document.getElementById("shipped-orders").innerText =
        orders.filter(order => order.status === "Shipped").length;

    document.getElementById("delivered-orders").innerText =
        orders.filter(order => order.status === "Delivered").length;

    if (filteredOrders.length === 0) {

        ordersList.innerHTML = "<h3>No orders yet.</h3>";
        return;

    }

    ordersList.innerHTML = "";

    filteredOrders.forEach((order, index) => {

        if (!order.status) {
            order.status = "New Order";
        }

        ordersList.innerHTML += `
            <div class="order-card">

                <h2>Order #${index + 1}</h2>
<p><strong>Order Date:</strong> ${new Date(order.created_at).toLocaleString()}</p>
                <p><strong>Order ID:</strong> ${order.order_id}</p>
                
                <p><strong>Name:</strong> ${order.customer_name}</p>

                <p><strong>Phone:</strong> ${order.customer_phone}</p>

                <p><strong>Address:</strong> ${order.customer_address}</p>

                <p><strong>City:</strong> ${order.customer_city}</p>

                <p><strong>PIN Code:</strong> ${order.customer_pincode}</p>

                <p><strong>Total:</strong> ₹${order.total}</p>
                <p><strong>Products Ordered:</strong></p>
<ul>
${(order.products || []).map(product => `
    <li>${product.name} × ${product.qty} — ₹${product.price}</li>
`).join("")}
</ul>

                <p>
                    <strong>Status:</strong>
                    ${order.status}
                </p>

                <button onclick="updateStatus(${orders.indexOf(order)}, 'Confirmed')">
                    Confirm
                </button>

                <button onclick="updateStatus(${orders.indexOf(order)}, 'Packed')">
                    Packed
                </button>

                <button onclick="updateStatus(${orders.indexOf(order)}, 'Shipped')">
                    Shipped
                </button>

                <button onclick="updateStatus(${orders.indexOf(order)}, 'Delivered')">
                    Delivered
                </button>

                <hr>

            </div>
        `;

    });

    
}
async function logoutAdmin() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Logout failed: " + error.message);
        return;
    }

    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("login-box").style.display = "block";

    document.getElementById("admin-email").value = "";
    document.getElementById("admin-password").value = "";
}
function togglePassword() {
    const passwordInput = document.getElementById("admin-password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}
function searchOrders() {
    const searchText = document
        .getElementById("search-orders")
        .value
        .toLowerCase()
        .trim();

    const filteredOrders = orders.filter(order =>
        (order.order_id || "").toLowerCase().includes(searchText) ||
        (order.customer_name || "").toLowerCase().includes(searchText) ||
        (order.customer_phone || "").toString().includes(searchText)
    );

    displayOrders(filteredOrders);
}

function filterByStatus() {
    const status = document.getElementById("status-filter").value;

    if (status === "All") {
        displayOrders(orders);
        return;
    }

    const filteredOrders = orders.filter(order =>
        (order.status || "New Order") === status
    );

    displayOrders(filteredOrders);
}
</script>

</body>
</html>
