<!DOCTYPE html>
<html>
<head>
    <title>Sree Cosmetics - Admin Orders</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div id="login-box">
    <h1>🔐 Sree Cosmetics</h1>
    <h2>Admin Login</h2>

    <input type="email" id="admin-email" placeholder="Admin Email">

    <input type="password" id="admin-password" placeholder="Password">

    <button onclick="adminLogin()">Login</button>

    <p id="login-error"></p>
</div>

<div id="admin-panel" style="display:none;">
    <h1>Admin - Orders</h1>

    <button onclick="logoutAdmin()">Logout</button>

    <div id="orders-list"></div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

let orders = [];

const SUPABASE_URL = "https://mdptetvirfxfhfpjylkk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BvNM859TFgKaPOKV99ds9A_Qigy8-Jp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function adminLogin() {
    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;
    const errorBox = document.getElementById("login-error");

    errorBox.innerText = "";

    if (!email || !password) {
        errorBox.innerText = "Please enter email and password.";
        return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        errorBox.innerText = "Login failed: " + error.message;
        return;
    }

    document.getElementById("login-box").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";

    loadOrders();
}


async function loadOrders() {
    const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Error loading orders:", error);
        ordersList.innerHTML = "<h3>Could not load orders.</h3>";
        return;
    }

    orders = data || [];
    displayOrders();
}

let ordersList = document.getElementById("orders-list");

async function updateStatus(index, status) {

    const order = orders[index];

    const { error } = await supabaseClient
        .from("orders")
        .update({ status: status })
        .eq("order_id", order.order_id);

    if (error) {
        console.error("Status update error:", error);
        alert("Could not update order status.");
        return;
    }

    orders[index].status = status;
    displayOrders();
}

function displayOrders() {

    if (orders.length === 0) {

        ordersList.innerHTML = "<h3>No orders yet.</h3>";
        return;

    }

    ordersList.innerHTML = "";

    orders.forEach((order, index) => {

        if (!order.status) {
            order.status = "New Order";
        }

        ordersList.innerHTML += `
            <div class="order-card">

                <h2>Order #${index + 1}</h2>

                <p><strong>Order ID:</strong> ${order.order_id}</p>

                <p><strong>Name:</strong> ${order.customer_name}</p>

                <p><strong>Phone:</strong> ${order.customer_phone}</p>

                <p><strong>Address:</strong> ${order.customer_address}</p>

                <p><strong>City:</strong> ${order.customer_city}</p>

                <p><strong>PIN Code:</strong> ${order.customer_pincode}</p>

                <p><strong>Total:</strong> ₹${order.total}</p>

                <p>
                    <strong>Status:</strong>
                    ${order.status}
                </p>

                <button onclick="updateStatus(${index}, 'Confirmed')">
                    Confirm
                </button>

                <button onclick="updateStatus(${index}, 'Packed')">
                    Packed
                </button>

                <button onclick="updateStatus(${index}, 'Shipped')">
                    Shipped
                </button>

                <button onclick="updateStatus(${index}, 'Delivered')">
                    Delivered
                </button>

                <hr>

            </div>
        `;

    });

    
}
async function logoutAdmin() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Logout failed: " + error.message);
        return;
    }

    document.getElementById("admin-panel").style.display = "none";
    document.getElementById("login-box").style.display = "block";

    document.getElementById("admin-email").value = "";
    document.getElementById("admin-password").value = "";
}

</script>

</body>
</html>
